<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" class="celora-brand-logo">
  <defs>
    <linearGradient id="celora-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="50%" stop-color="#00c49f"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="celora-grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Stylized Pixelated C Symbol -->
  <g transform="translate(10, 8)" filter="url(#glow-filter)">
    <!-- Pixels on the top-left -->
    <rect x="0" y="24" width="8" height="8" rx="1.5" fill="#00f5a0" fill-opacity="0.8"/>
    <rect x="10" y="16" width="8" height="8" rx="1.5" fill="#00d2b4" fill-opacity="0.9"/>
    <rect x="10" y="26" width="8" height="8" rx="1.5" fill="#0284c7" fill-opacity="0.85"/>
    <rect x="18" y="8" width="8" height="8" rx="1.5" fill="#00f5a0"/>
    <rect x="20" y="20" width="8" height="8" rx="1.5" fill="#00c49f"/>
    
    <!-- Main Curving C Body -->
    <path d="M46 6 C28 6 16 18 16 34 C16 50 28 62 46 62 C58 62 66 54 68 46 L55 46 C53 50 49 53 45 53 C34 53 27 45 27 34 C27 23 34 15 45 15 C50 15 54 18 56 22 L69 22 C66 12 58 6 46 6 Z" 
          fill="url(#celora-grad-1)"/>
          
    <!-- Inner Accent Arc -->
    <path d="M44 20 C36 20 31 26 31 34 C31 42 36 48 44 48 C48 48 52 45 54 41 L47 41 C45 43 44 43 43 43 C39 43 36 39 36 34 C36 29 39 25 43 25 C45 25 46 26 47 27 L55 27 C52 23 48 20 44 20 Z" 
          fill="#ffffff" fill-opacity="0.25"/>
  </g>

  <!-- Typography: CeloraIT -->
  <text x="86" y="47" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" letter-spacing="-0.5" fill="#ffffff">
    Celora<tspan fill="#00f5a0">IT</tspan>
  </text>
  
  <!-- Sleek Accent Underline Bar -->
  <rect x="87" y="55" width="48" height="3" rx="1.5" fill="url(#celora-grad-1)"/>
  <rect x="139" y="55" width="24" height="3" rx="1.5" fill="#38bdf8"/>
</svg>
